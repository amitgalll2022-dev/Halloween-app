<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0b2e">
<title>ממתק או ברדק – מפת הדלעות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b0b2e; --plum:#2d1450; --plum2:#40206b; --orange:#ff8a1f; --glow:#ffb347;
  --slime:#8dff5a; --bone:#fff4e0; --muted:#c9b3e6; --danger:#ff6b6b;
  --display:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}

/* header */
header{position:relative;background:linear-gradient(180deg,#120620 0%,var(--plum) 100%);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:3px solid var(--orange);overflow:hidden;flex:none}
header h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,32px);color:var(--glow);
  text-shadow:0 0 12px rgba(255,138,31,.7),2px 2px 0 #000;line-height:1.1}
.kicker{font-family:var(--display);font-size:15px;color:var(--slime);margin-bottom:2px;letter-spacing:.3px;text-shadow:0 0 8px rgba(141,255,90,.5)}
header p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bat{position:absolute;top:8px;font-size:20px;opacity:.85;animation:fly 9s linear infinite;pointer-events:none}
.bat:nth-child(2){top:34px;font-size:15px;animation-duration:13s;animation-delay:-5s}
@keyframes fly{from{inset-inline-start:-10%;transform:translateY(0)}50%{transform:translateY(10px)}to{inset-inline-start:110%;transform:translateY(0)}}
.web{position:absolute;top:0;inset-inline-end:0;width:70px;height:70px;opacity:.35;pointer-events:none}

.events{display:flex;flex-direction:column;gap:6px;padding:8px 16px;flex:none;background:var(--night)}
.chip{background:var(--plum);border:1px solid var(--plum2);border-radius:12px;padding:6px 12px;font-size:13px;line-height:1.35;display:flex;gap:8px;align-items:baseline}
.chip b{color:var(--glow);font-weight:700;white-space:nowrap}

/* map */
#mapwrap{position:relative;flex:1;min-height:180px}
#map{position:absolute;inset:0;background:#15082a}
.leaflet-container{font-family:var(--body)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) brightness(.85) contrast(.95) saturate(.7)}
.pumpkin{font-size:30px;line-height:1;text-align:center;filter:drop-shadow(0 0 7px rgba(255,138,31,.95)) drop-shadow(0 2px 2px #000);transition:transform .15s}
.pumpkin:hover{transform:scale(1.2)}
.pumpkin.done{opacity:.45;filter:grayscale(.6)}
.pumpkin.approx{filter:drop-shadow(0 0 7px rgba(141,255,90,.9)) drop-shadow(0 2px 2px #000)}
.me{font-size:30px;line-height:1;text-align:center;filter:drop-shadow(0 0 8px #fff);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.leaflet-popup-content-wrapper{background:var(--plum);color:var(--bone);border:2px solid var(--orange);border-radius:16px}
.leaflet-popup-tip{background:var(--plum);border:1px solid var(--orange)}
.leaflet-popup-content{margin:12px 14px;direction:rtl;text-align:right}
.leaflet-container a.leaflet-popup-close-button{inset-inline-start:6px;inset-inline-end:auto;left:6px;right:auto;color:var(--muted)}
.pop-name{font-family:var(--display);font-size:18px;color:var(--glow);margin-bottom:2px}
.pop-addr{font-size:14px;margin-bottom:8px}
.pop-note{font-size:12px;color:var(--slime);margin-bottom:8px}
.pop-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;text-decoration:none;display:inline-block;
  background:var(--orange);color:#2a1100}
.btn.alt{background:var(--plum2);color:var(--bone)}
.btn.ok{background:var(--slime);color:#10300a}
.btn:focus-visible,.row:focus-visible,#locate:focus-visible{outline:3px solid var(--slime);outline-offset:2px}

#locate{position:absolute;z-index:500;inset-inline-start:12px;bottom:14px;background:var(--plum);color:var(--bone);border:2px solid var(--orange);
  border-radius:999px;padding:10px 14px;font:500 14px var(--body);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#status{position:absolute;z-index:500;top:10px;inset-inline-start:50%;transform:translateX(50%);max-width:92%;background:rgba(27,11,46,.92);
  border:1px solid var(--orange);border-radius:12px;padding:7px 12px;font-size:13px;text-align:center}
[dir=rtl] #status{transform:translateX(50%)}
#status[hidden]{display:none}
#bar{height:4px;background:var(--plum2);border-radius:4px;margin-top:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .3s}

/* list sheet */
#sheet{flex:none;background:var(--plum);border-top:3px solid var(--orange);max-height:40%;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
#sheet.closed{max-height:none}
#mapwrap{min-height:200px}
#sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;cursor:pointer;background:none;border:0;color:var(--bone);width:100%;font:inherit;text-align:start}
#sheethead strong{font-family:var(--display);font-weight:400;font-size:17px;color:var(--glow)}
#prog{font-size:13px;color:var(--slime)}
#list{overflow-y:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch}
#sheet.closed #list{display:none}
.street{font-family:var(--display);color:var(--glow);font-size:14px;margin:10px 4px 4px}
.row{display:flex;align-items:center;gap:10px;width:100%;background:var(--night);border:1px solid var(--plum2);border-radius:12px;padding:9px 12px;margin-bottom:6px;
  color:var(--bone);font:inherit;text-align:start;cursor:pointer}
.row .em{font-size:22px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500}
.row .t span{font-size:12px;color:var(--muted)}
.row .d{font-size:12px;color:var(--slime);white-space:nowrap}
.row.done{opacity:.55}
.row.miss .d{color:var(--danger)}
footer{font-size:11px;color:var(--muted);text-align:center;padding:4px 12px 6px;background:var(--plum)}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bat,.me{animation:none}}

body{display:block;overflow-y:auto;height:auto;min-height:100%}
html{height:auto}
#mapwrap{position:relative;flex:none;height:62vh;min-height:320px;border-bottom:3px solid var(--orange)}
#mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#15082a}
.cta{display:block;margin:12px 16px;text-align:center;padding:14px;font-size:16px;border-radius:16px}
.note{margin:0 16px 8px;font-size:13px;color:var(--muted);text-align:center}
#list{padding:0 12px 16px;max-height:none}
.row{cursor:default;flex-wrap:wrap}
.row .acts{display:flex;gap:6px;width:100%;margin-top:6px}
.row .acts .btn{flex:1;text-align:center;padding:8px 6px}
.big{margin:18px 16px 10px;padding:22px 14px;font-family:var(--display);font-weight:400;font-size:clamp(22px,6.5vw,30px);border-radius:22px;box-shadow:0 0 22px rgba(255,138,31,.55),0 4px 0 #b35500}
</style>
</head>
<body>
<header>
  <span class="bat" aria-hidden="true">🦇</span><span class="bat" aria-hidden="true">🦇</span>
  <svg class="web" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#fff" stroke-width="1" fill="none"><path d="M100 0 0 0M100 0 80 100M100 0 40 80M100 0 0 40M100 0 100 100"/><path d="M85 0Q80 18 100 22M65 0Q55 35 100 45M45 0Q35 55 100 70M25 0Q15 70 100 95"/></g></svg>
  <div class="kicker">קהילת ברנדייס חוגגת:</div>
  <h1>🎃 ממתק או ברדק 🎃</h1>
  <p>כל הבתים המארחים בשכונה על המפה</p>
</header>
<div class="events">
  <div class="chip"><b>🍪 <bdi dir="ltr">15:00–17:00</bdi></b><span>קישוט עוגיות בקפה נוליטה, מרכז המסילה</span></div>
  <div class="chip"><b>🍬 17:00</b><span>ממתק או ברדק בבתים המארחים</span></div>
</div>
<a class="btn cta big" href="https://www.google.com/maps/d/viewer?mid=1pF3x-kHHg0ZHVeAcO8JFIUROIw8wfpM" target="_blank" rel="noopener">🎃 פתחו את מפת הבתים 👻</a>
<p class="note">נפתח בגוגל מפות: רואים את כל הבתים ואת עצמכם בזמן אמת.</p>
<section id="sheet" style="max-height:none;border-top:3px solid var(--orange)">
  <div id="sheethead" style="cursor:default"><strong>רשימת הבתים (20)</strong><span id="prog"></span></div>
  <div id="list"></div>
</section>
<footer>מפה: Google My Maps</footer>
<script>
const HOUSES=[{"family": "קול", "street": "נורדאו", "num": "15", "note": "קומה מינוס 1"}, {"family": "וורצל", "street": "נורדאו", "num": "65", "note": ""}, {"family": "שהרבני", "street": "נורדאו", "num": "68", "note": ""}, {"family": "מירון", "street": "המדרון", "num": "9", "note": "דירה 1"}, {"family": "סולטן", "street": "המדרון", "num": "13", "note": "דירה 4"}, {"family": "לוי", "street": "המדרון", "num": "13", "note": "דירה 5"}, {"family": "רומי", "street": "המדרון", "num": "4", "note": ""}, {"family": "אלכסנדרוביץ׳", "street": "מורדות ים", "num": "1", "note": ""}, {"family": "מחרז", "street": "פישמן", "num": "4", "note": ""}, {"family": "יחילבסקי", "street": "נוף שדמות", "num": "27", "note": ""}, {"family": "ברוך", "street": "נוף שדמות", "num": "54", "note": "דירה 1"}, {"family": "כהן", "street": "נוף שדמות", "num": "50", "note": ""}, {"family": "אבניאון", "street": "היתד", "num": "4א", "note": ""}, {"family": "גופר", "street": "ברכה צפירה", "num": "5", "note": ""}, {"family": "אהרונסון", "street": "דב הוז", "num": "7א", "note": ""}, {"family": "גלברד", "street": "דב הוז", "num": "37א", "note": ""}, {"family": "ביטון", "street": "זמנהוף", "num": "2", "note": ""}, {"family": "רוזנברג", "street": "זמנהוף", "num": "4", "note": "דירה 1"}, {"family": "לנדו/חיוט", "street": "זמנהוף", "num": "7", "note": ""}, {"family": "ויילד", "street": "זמנהוף", "num": "16", "note": ""}];
const CITY='הרצליה';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get('hw26-done-g1',{});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  const by={}; HOUSES.forEach((h,i)=>{h.id='h'+i;(by[h.street]=by[h.street]||[]).push(h)});
  Object.keys(by).forEach(st=>{
    const t=document.createElement('div'); t.className='street'; t.textContent='📍 '+st; list.appendChild(t);
    by[st].forEach(h=>{
      const q=encodeURIComponent(h.street+' '+h.num+', '+CITY);
      const r=document.createElement('div'); r.className='row'+(done[h.id]?' done':'');
      r.innerHTML='<span class="em">'+(done[h.id]?'✅':'🎃')+'</span><span class="t"><b>'+esc(h.family)+'</b><span>'+esc(h.street+' '+h.num+(h.note?' · '+h.note:''))+'</span></span>'+
        '<div class="acts"><a class="btn" href="https://waze.com/ul?q='+q+'&navigate=yes" target="_blank" rel="noopener">Waze</a>'+
        '<a class="btn alt" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">Google Maps</a>'+
        '<button class="btn '+(done[h.id]?'alt':'ok')+'" type="button">'+(done[h.id]?'ביטול':'ביקרתי ✔')+'</button></div>';
      r.querySelector('button').addEventListener('click',()=>{ if(done[h.id]) delete done[h.id]; else done[h.id]=true; store.set('hw26-done-g1',done); render(); });
      list.appendChild(r);
    });
  });
  const c=Object.keys(done).length;
  document.getElementById('prog').textContent=c?('ביקרתם ב-'+c+' מתוך '+HOUSES.length+' 🍬'):'';
}
render();
</script>
</body>
</html>
